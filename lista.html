<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lista de Videos y Audios</title>
</head>
<body>

  <h1>🎬 Lista de Videos</h1>
  <ul>
    <li>
      <h3>Video de gato bailando</h3>
      <video width="320" height="240" controls>
        <source src="gato.mp4" type="video/mp4">
        Gato bailando.
      </video>
    </li>
    <li>
      <h3>Video de perro bailando</h3>
      <video width="320" height="240" controls>
        <source src="perro.mp4" type="video/mp4">
        Perro bailando.
      </video>
    </li>
  </ul>

  <h1>🎵 Lista de Audios</h1>
  <ul>
    <li>
      <h3>Audio Eren Jaeger Tatakae</h3>
      <audio controls>
        <source src="eren-jaeger-saying-tatakae.mp3" type="audio/mpeg">
        Tatakae
      </audio>
    </li>
    <li>
      <h3>Audio "I am Atomic"</h3>
      <audio controls>
        <source src="Atomic.mp3" type="audio/mpeg">
        I am Atomic.
      </audio>
    </li>
  </ul>

</body>
</html>
